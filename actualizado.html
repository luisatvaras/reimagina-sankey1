<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --surface-2: #f3f2ef;
    --border: #e2e1dc;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a8984;
    --node: #52514e;
    --no-source: #b9b8b2;
    --d1: #2a78d6; --d2: #eb6834; --d3: #1baf7a; --d4: #eda100;
    --d5: #e87ba4; --d6: #008300; --d7: #4a3aa7; --d8: #e34948;
    --link-opacity: 0.38;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19; --surface-2: #242422; --border: #3a3a37;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
      --node: #c3c2b7; --no-source: #5c5b56;
      --d1: #3987e5; --d2: #d95926; --d3: #199e70; --d4: #c98500;
      --d5: #d55181; --d6: #008300; --d7: #9085e9; --d8: #e66767;
      --link-opacity: 0.45;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --surface-2: #242422; --border: #3a3a37;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --node: #c3c2b7; --no-source: #5c5b56;
    --d1: #3987e5; --d2: #d95926; --d3: #199e70; --d4: #c98500;
    --d5: #d55181; --d6: #008300; --d7: #9085e9; --d8: #e66767;
    --link-opacity: 0.45;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-1);
    color: var(--text-primary);
    font-family: Montserrat, system-ui, sans-serif;
  }
  header { padding: 28px 32px 8px; max-width: 1100px; }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
  .subtitle { margin: 0; color: var(--text-secondary); font-size: 14px; line-height: 1.5; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 14px 32px 0; font-size: 12px; color: var(--text-secondary); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .chart-wrap { overflow-x: auto; padding: 8px 16px 24px; }
  svg { display: block; font-family: inherit; }
  .col-title { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; fill: var(--text-muted); }
  .node rect { rx: 2px; }
  .node text { font-size: 11px; fill: var(--text-primary); paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
  .node .count { fill: var(--text-muted); }
  .node.domain text, .node.city text, .node.scale text, .node.clean text { font-size: 13px; font-weight: 600; }
  .node.core text { font-weight: 500; }
  /* Subvariables "Anterior (sankey)": el PDF ya no las nombra. Bandas más
     tenues y nombre en cursiva gris. */
  .link.anterior { stroke-opacity: calc(var(--link-opacity) * 0.35); }
  .node.sub.anterior text { font-style: italic; fill: var(--text-muted); }
  /* Core measures: círculo lleno = se recalcula; vacío = solo diagnóstico */
  .cls-mark { stroke: var(--node); stroke-width: 1.5; }
  .cls-mark.recalc { fill: var(--node); }
  .cls-mark.diag { fill: var(--surface-1); }
  .legend .ant { width: 22px; height: 8px; border-radius: 2px; background: var(--text-muted); opacity: 0.3; }
  .legend .mk { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--node); }
  .legend .mk.recalc { background: var(--node); }
  .link { fill: none; stroke-opacity: var(--link-opacity); transition: stroke-opacity 120ms; }
  svg.focus .link { stroke-opacity: 0.06; }
  svg.focus .link.on { stroke-opacity: 0.75; }
  /* Sankey completo: bandas como listones rellenos (no trazos gruesos, que se
     ven "torcidos" cuando la curva sube o baja mucho) */
  .link.ribbon { stroke: none; fill-opacity: var(--link-opacity); transition: fill-opacity 120ms; }
  .link.ribbon.anterior { fill-opacity: calc(var(--link-opacity) * 0.35); }
  svg.focus .link.ribbon { fill-opacity: 0.06; }
  svg.focus .link.ribbon.on { fill-opacity: 0.75; }
  svg.focus .node { opacity: 0.25; }
  svg.focus .node.on { opacity: 1; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 10; max-width: 340px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; line-height: 1.45; color: var(--text-secondary);
    box-shadow: 0 6px 20px rgba(0,0,0,0.12); opacity: 0; transition: opacity 80ms;
  }
  .tooltip strong { display: block; color: var(--text-primary); font-size: 13px; margin-bottom: 4px; }
  .tooltip dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .tooltip dt { color: var(--text-muted); }
  .tooltip dd { margin: 0; color: var(--text-primary); }
  .tooltip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

  /* Selector de vista: Sankey / Dona */
  .views { display: inline-flex; margin-top: 14px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .views button { font: inherit; font-size: 13px; padding: 6px 14px; border: none; background: none; color: var(--text-secondary); cursor: pointer; }
  .views button + button { border-left: 1px solid var(--border); }
  .views button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-1); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-top: 14px; }
  .controls .views { margin-top: 0; }
  .toggle-ant { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
  .toggle-ant input { width: 16px; height: 16px; accent-color: var(--text-primary); margin: 0; }

  /* Dona: dominios al centro, luego core measures y subvariables */
  .donut-wrap { overflow-x: auto; padding: 8px 16px 24px; }
  .donut-wrap svg { margin: 0 auto; }
  .arc { stroke: var(--surface-1); stroke-width: 1; transition: opacity 120ms; }
  .dlabel { font-size: 11px; fill: var(--text-primary); paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; transition: opacity 120ms; }
  .dlabel.domain { font-size: 12px; font-weight: 600; }
  .dlabel.core { font-weight: 500; }
  .dlabel.sub.anterior { font-style: italic; fill: var(--text-muted); }
  #donut.focus .arc:not(.on), #donut.focus .dlabel:not(.on), #donut.focus .cls-mark:not(.on) { opacity: 0.15; }
  .donut-center { text-anchor: middle; pointer-events: none; }
  .donut-center .big { font-size: 26px; font-weight: 700; fill: var(--text-primary); }
  .donut-center .small { font-size: 12px; fill: var(--text-secondary); }

  details { margin: 0 32px 40px; font-size: 13px; }
  summary { cursor: pointer; color: var(--text-secondary); font-weight: 500; }
  table { border-collapse: collapse; margin-top: 12px; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>

// Filtros de arriba. La elección va en la liga y se redibuja todo al cambiarla:
// - subvariables "Anterior (sankey)": apagadas al abrir; ?anteriores=1 las muestra
// - core measures de solo diagnóstico (y sus subvariables): prendidas al abrir; ?diagnostico=0 las oculta
const PARAMS = new URLSearchParams(location.search);
const SHOW_ANT = PARAMS.get("anteriores") === "1";
const SHOW_DIAG = PARAMS.get("diagnostico") !== "0";
const ROWS = ALL_ROWS.filter(r => (SHOW_ANT || !r.anterior) && (SHOW_DIAG || r.cls !== "Diagnóstico"));
function wireFilter(boxId, param, checked, onValue, offValue) {
  const box = document.getElementById(boxId);
  box.checked = checked;
  box.addEventListener("change", () => {
    const q = new URLSearchParams(location.search);
    const v = box.checked ? onValue : offValue;
    if (v == null) q.delete(param); else q.set(param, v);
    const qs = q.toString();
    location.href = location.pathname + (qs ? "?" + qs : "") + location.hash;
  });
}
wireFilter("show-ant", "anteriores", SHOW_ANT, "1", null);
wireFilter("show-diag", "diagnostico", SHOW_DIAG, null, "0");
// Niveles de "Reto de limpieza para escalabilidad" (build_sankey_actualizado.py)
const CLEANING = ["Alto", "Medio", "Bajo", "Nulo"];
const CITY_DOMAINS = {"Condesa": ["Sociodemographics"], "Mexicali": ["Sociodemographics"], "Topochico": ["Sociodemographics"], "Tlalpan": ["Sociodemographics"], "Monterrey": ["Sociodemographics"]};
const CITIES = Object.keys(CITY_DOMAINS);
const SCALES = ["Mundial", "Nacional", "Local", "Por proyecto"];
const SOURCE_SCALE = {"OSM Road Network": "Mundial", "DENUE_2026": "Nacional", "Censo 2020": "Nacional", "INEGI Marco Geoestadístico (02sip)": "Nacional", "INVI 2020": "Nacional", "SESNSP": "Nacional"};
const NO_SOURCE = "Sin fuente definida";

// --- Colores: un color por dominio, en orden fijo por tamaño -------------
// (de todas las filas, también las anteriores: así los colores no cambian al ocultarlas)
const domainCount = d3.rollup(ALL_ROWS.flatMap(r => r.domains), v => v.length, d => d);
const ALL_DOMAINS = [...domainCount.keys()].sort((a, b) => domainCount.get(b) - domainCount.get(a));
const domainVar = new Map(ALL_DOMAINS.map((d, i) => [d, `var(--d${i + 1})`]));
// Solo los dominios que quedan con los filtros de arriba
const DOMAINS = ALL_DOMAINS.filter(d => ROWS.some(r => r.domains.includes(d)));

// --- Flujos: una unidad por (subvariable × dominio), repartida entre sus
// fuentes y entre las ciudades conectadas a ese dominio (si hay). Cada link
// del sankey guarda qué flujos pasan por él, para poder resaltar el
// recorrido completo al hacer hover.
const citiesOf = d => CITIES.filter(c => CITY_DOMAINS[c].includes(d));
const flows = [];
ROWS.forEach((r, ri) => {
  r.domains.forEach(d => {
    const cities = citiesOf(d);
    (cities.length ? cities : [null]).forEach(city => {
      r.sources.forEach(s => flows.push({
        ri, d, city, core: r.core, sub: r.sub, src: s, scale: SOURCE_SCALE[s] || null, anterior: r.anterior,
        lvl: r.cleaning || null, // sin nivel: la banda termina en escalabilidad
        w: 1 / r.sources.length / (cities.length || 1),
      }));
    });
  });
});

// Orden de nodos: dominios por tamaño; core measures agrupadas por su
// dominio principal; subvariables bajo su core; fuentes según la posición
// media de las subvariables que las alimentan (menos cruces). Sin fuente al final.
const coreOrder = [];
DOMAINS.forEach(d => ROWS.forEach(r => { if (r.domains[0] === d && !coreOrder.includes(r.core)) coreOrder.push(r.core); }));
const subOrder = [];
coreOrder.forEach(c => ROWS.forEach((r, ri) => { if (r.core === c) subOrder.push(ri); }));
const subPos = new Map(subOrder.map((ri, i) => [ri, i]));
const srcPos = d3.rollup(flows, v => d3.mean(v, f => subPos.get(f.ri)), f => f.src);
const sources = [...srcPos.keys()].sort((a, b) => (a === NO_SOURCE) - (b === NO_SOURCE) || srcPos.get(a) - srcPos.get(b));

const nodes = [];
const nodeId = new Map();
function addNode(key, col, name, extra = {}) { nodeId.set(key, nodes.length); nodes.push({ key, col, name, ...extra }); }
CITIES.forEach(c => addNode("m:" + c, 0, c, { kind: "city" }));
DOMAINS.forEach(d => addNode("d:" + d, 1, d, { kind: "domain", domain: d }));
coreOrder.forEach(c => addNode("c:" + c, 2, c, { kind: "core" }));
subOrder.forEach(ri => addNode("s:" + ri, 3, ROWS[ri].sub, { kind: "sub", row: ROWS[ri] }));
sources.forEach(s => addNode("f:" + s, 4, s, { kind: "source" }));
SCALES.forEach(e => addNode("e:" + e, 5, e, { kind: "scale" }));
// Reto de limpieza (al final): siempre los 4 niveles, aunque no tengan
// subvariables todavía (como las ciudades de estudio).
CLEANING.forEach(l => addNode("r:" + l, 6, l, { kind: "clean" }));

const linkMap = new Map();
function addLink(a, b, d, fi, w) {
  const k = `${a}|${b}|${d}`;
  if (!linkMap.has(k)) linkMap.set(k, { source: nodeId.get(a), target: nodeId.get(b), value: 0, domain: d, flows: new Set() });
  const l = linkMap.get(k); l.value += w; l.flows.add(fi);
}
flows.forEach((f, fi) => {
  if (f.city) addLink("m:" + f.city, "d:" + f.d, f.d, fi, f.w);
  addLink("d:" + f.d, "c:" + f.core, f.d, fi, f.w);
  addLink("c:" + f.core, "s:" + f.ri, f.d, fi, f.w);
  addLink("s:" + f.ri, "f:" + f.src, f.d, fi, f.w);
  // sin escala o sin nivel de reto, la banda simplemente termina ahí
  if (f.scale) addLink("f:" + f.src, "e:" + f.scale, f.d, fi, f.w);
  if (f.scale && f.lvl) addLink("e:" + f.scale, "r:" + f.lvl, f.d, fi, f.w);
});
// d3-sankey decide cuántas columnas hay según el camino conectado más
// largo, y ninguno llega todavía de "Ciudad" a "Escalabilidad" — sin esto
// la última columna se encima con la de fuentes. Una cadena invisible de
// nodos y links de valor 0 fuerza las 6 columnas; no se dibuja.
const COLS = 7;
for (let c = 0; c < COLS; c++) addNode("ghost:" + c, c, "", { kind: "ghost" });
for (let c = 0; c < COLS - 1; c++) {
  linkMap.set("ghost" + c, { source: nodeId.get("ghost:" + c), target: nodeId.get("ghost:" + (c + 1)), value: 0, domain: null, flows: new Set() });
}
const links = [...linkMap.values()];
nodes.forEach((n, i) => { n.flows = new Set(); });
links.forEach(l => l.flows.forEach(fi => { nodes[l.source].flows.add(fi); nodes[l.target].flows.add(fi); }));

// --- Layout ----------------------------------------------------------------
const W = 2250, H = 1700;
const M = { top: 40, right: 140, bottom: 20, left: 150 };
const svg = d3.select("#chart").attr("width", W).attr("height", H).attr("viewBox", [0, 0, W, H]);

const sankey = d3.sankey()
  .nodeId((d, i) => i)
  .nodeAlign(n => n.col)
  .nodeWidth(10)
  .nodePadding(8)
  .nodeSort(null)
  // Orden de las bandas en cada nodo: por la altura del otro extremo y, entre
  // los mismos dos nodos, por dominio (igual en ambos extremos): menos cruces.
  .linkSort((a, b) => (a.target.y0 - b.target.y0) || (a.source.y0 - b.source.y0) ||
    (ALL_DOMAINS.indexOf(a.domain) - ALL_DOMAINS.indexOf(b.domain)))
  .extent([[M.left, M.top], [W - M.right, H - M.bottom]]);
const graph = sankey({ nodes: nodes.map(d => ({ ...d })), links: links.map(d => ({ ...d })) });

// Ciudades y escalabilidad se reparten a lo alto de toda la columna (cada
// nodo centrado en su franja), en vez de quedar apilados arriba o frente a
// lo que conectan.
function spreadColumn(kind) {
  const col = graph.nodes.filter(n => n.kind === kind);
  const slot = (H - M.top - M.bottom) / col.length;
  col.forEach((n, i) => {
    const h = n.y1 - n.y0, mid = M.top + slot * (i + 0.5);
    n.y0 = mid - h / 2; n.y1 = mid + h / 2;
  });
}
spreadColumn("city");
spreadColumn("clean");
// Escalabilidad: las escalas sin fuentes miden 0 y sus nombres se encimaban;
// se separan al menos SCALE_GAP px (y la columna sube si se sale por abajo).
const SCALE_GAP = 24;
const scaleNodes = graph.nodes.filter(n => n.kind === "scale").sort((a, b) => a.y0 - b.y0);
for (let i = 1; i < scaleNodes.length; i++) {
  const prev = scaleNodes[i - 1], n = scaleNodes[i];
  const dy = prev.y1 + SCALE_GAP - n.y0;
  if (dy > 0) { n.y0 += dy; n.y1 += dy; }
}
const overflow = scaleNodes.length ? scaleNodes.at(-1).y1 - (H - M.bottom) : 0;
if (overflow > 0) scaleNodes.forEach(n => { n.y0 -= overflow; n.y1 -= overflow; });
sankey.update(graph);

const colX = d3.range(COLS).map(c => graph.nodes.find(n => n.col === c).x0);
["Ciudad de estudio", "Dominio", "Core measure", "Subvariable", "Fuente de datos", "Escalabilidad", "Reto de limpieza"].forEach((t, c) => {
  svg.append("text").attr("class", "col-title").attr("x", colX[c] + (c === 0 ? 10 : 0)).attr("y", 20)
    .attr("text-anchor", c === 0 ? "end" : "start").text(t);
});

// Listón relleno de una banda: bordes superior e inferior con la misma curva.
function ribbon(l) {
  const x0 = l.source.x1, x1 = l.target.x0, xm = (x0 + x1) / 2, h = Math.max(1, l.width) / 2;
  return `M${x0},${l.y0 - h}C${xm},${l.y0 - h} ${xm},${l.y1 - h} ${x1},${l.y1 - h}` +
    `L${x1},${l.y1 + h}C${xm},${l.y1 + h} ${xm},${l.y0 + h} ${x0},${l.y0 + h}Z`;
}
const linkSel = svg.append("g").selectAll("path").data(graph.links.filter(l => l.domain)).join("path")
  // anterior: todas las subvariables que pasan por la banda son "Anterior (sankey)"
  .attr("class", l => "link ribbon" + ([...l.flows].every(fi => flows[fi].anterior) ? " anterior" : ""))
  .attr("d", ribbon)
  .style("fill", d => domainVar.get(d.domain)); // style: la regla .link { fill: none } le ganaría a un atributo

const nodeSel = svg.append("g").selectAll("g").data(graph.nodes.filter(n => n.kind !== "ghost")).join("g")
  .attr("class", d => `node ${d.kind}` + (d.kind === "sub" && d.row.anterior ? " anterior" : ""));
nodeSel.append("rect")
  .attr("x", d => d.x0)
  // Una escala sin fuentes conectadas mide 0 — se dibuja igual para que se vea.
  .attr("y", d => ["scale", "city", "clean"].includes(d.kind) && d.y1 - d.y0 < 8 ? (d.y0 + d.y1) / 2 - 4 : d.y0)
  .attr("width", d => d.x1 - d.x0).attr("height", d => ["scale", "city", "clean"].includes(d.kind) ? Math.max(8, d.y1 - d.y0) : Math.max(1, d.y1 - d.y0))
  .attr("fill", d => d.kind === "domain" ? domainVar.get(d.domain) : d.name === NO_SOURCE ? "var(--no-source)" : "var(--node)");

// Recálculo / diagnóstico de cada core measure (sale de "Para recalcular")
const coreCls = new Map(ROWS.map(r => [r.core, r.cls]));
nodeSel.filter(d => d.kind === "core").append("circle")
  .attr("class", d => "cls-mark " + (coreCls.get(d.name) === "Recálculo" ? "recalc" : "diag"))
  .attr("cx", d => d.x1 + 11).attr("cy", d => (d.y0 + d.y1) / 2).attr("r", 4);

const subCount = n => new Set([...n.flows].map(fi => flows[fi].ri)).size;
const truncate = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const label = nodeSel.append("text")
  .attr("x", d => d.kind === "city" ? d.x0 - 8 : d.x1 + (d.kind === "core" ? 19 : 6))
  .attr("y", d => (d.y0 + d.y1) / 2)
  .attr("dy", "0.35em")
  .attr("text-anchor", d => d.kind === "city" ? "end" : "start");
label.append("tspan").text(d => d.kind === "sub" ? truncate(d.name, 52) + (d.row.anterior ? " (anterior)" : "") : d.kind === "core" ? truncate(d.name, 44) : d.name);
label.filter(d => d.kind !== "sub").append("tspan").attr("class", "count").text(d => `  ${subCount(d)}`);

// --- Hover: resalta todos los flujos que pasan por el nodo/link ------------
const tip = d3.select("#tooltip");
function focus(flowSet) {
  svg.classed("focus", true);
  linkSel.classed("on", l => [...l.flows].some(fi => flowSet.has(fi)));
  nodeSel.classed("on", n => [...n.flows].some(fi => flowSet.has(fi)));
}
function unfocus() { svg.classed("focus", false); linkSel.classed("on", false); nodeSel.classed("on", false); tip.style("opacity", 0); }
function moveTip(e) {
  const pad = 14, box = tip.node().getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + box.width > innerWidth - 8) x = e.clientX - box.width - pad;
  if (y + box.height > innerHeight - 8) y = innerHeight - box.height - 8;
  tip.style("left", x + "px").style("top", y + "px");
}
const swatches = ds => ds.map(d => `<span class="sw" style="background:${domainVar.get(d)}"></span>${d}`).join("<br>");
function nodeTip(n) {
  if (n.kind === "sub") {
    const r = n.row;
    return `<strong>${r.sub}</strong><dl>
      <dt>Versión</dt><dd>${r.version}</dd>

      <dt>Dominio</dt><dd>${swatches(r.domains)}</dd>
      <dt>Fuente</dt><dd>${r.sourceRaw || NO_SOURCE}</dd>
      ${r.dataType ? `<dt>Data type</dt><dd>${r.dataType}</dd>` : ""}

      ${r.contradiction ? `<dt>Nota</dt><dd>${r.contradiction}</dd>` : ""}
      <dt>Reto de limpieza para escalabilidad</dt><dd>${r.cleaning || '<span style="color:var(--text-muted)">Sin definir</span>'}</dd>
      ${r.calculated ? `<dt>Calculado</dt><dd>${r.calculated}${r.by ? " · " + r.by : ""}</dd>` : ""}
      ${r.direction ? `<dt>Dirección</dt><dd>${r.direction}</dd>` : ""}</dl>`;
  }
  const byDomain = d3.rollup([...n.flows], v => new Set(v.map(fi => flows[fi].ri)).size, fi => flows[fi].d);
  const rowsHtml = DOMAINS.filter(d => byDomain.has(d)).map(d => `<dt><span class="sw" style="background:${domainVar.get(d)}"></span>${d}</dt><dd>${byDomain.get(d)}</dd>`).join("");
  const coreRow = n.kind === "core" ? ROWS.find(r => r.core === n.name) : null;
  const coreInfo = coreRow ? `<br>${coreRow.cls === "Recálculo" ? "Se recalcula con las acciones de ReImagina" : "Solo diagnóstico"}` +

  return `<strong>${n.name}</strong>${subCount(n)} subvariables${coreInfo}${n.kind === "domain" ? "" : `<dl>${rowsHtml}</dl>`}`;
}
nodeSel
  .on("mouseenter", (e, n) => { focus(n.flows); tip.html(nodeTip(n)).style("opacity", 1); moveTip(e); })
  .on("mousemove", moveTip)
  .on("mouseleave", unfocus);
linkSel
  .on("mouseenter", (e, l) => {
    focus(l.flows);
    tip.html(`<strong>${l.source.name} → ${l.target.name}</strong><span class="sw" style="background:${domainVar.get(l.domain)}"></span>${l.domain} · ${new Set([...l.flows].map(fi => flows[fi].ri)).size} subvariables`).style("opacity", 1);
    moveTip(e);

// --- Leyenda, subtítulo y tabla -------------------------------------------
d3.select("#legend").selectAll("span").data(DOMAINS).join("span")
  .html(d => `<i style="background:${domainVar.get(d)}"></i>${d}`);
d3.select("#legend").append("span").html(`<i class="mk recalc"></i>Se recalcula`);
if (SHOW_DIAG) d3.select("#legend").append("span").html(`<i class="mk"></i>Solo diagnóstico`);
if (SHOW_ANT) d3.select("#legend").append("span").html(`<i class="ant"></i>Subvariable anterior (el PDF ya no la nombra)`);
const noSrc = ROWS.filter(r => r.sources[0] === NO_SOURCE).length;
const nAnt = ALL_ROWS.filter(r => r.anterior).length;
d3.select("#subtitle").text(
  `Core measures del PDF "Acciones de ReImagina e indicadores de liveability". ` +

  (SHOW_ANT ? `${nAnt} son anteriores (venían del sankey anterior y el PDF ya no las nombra). ` : `sin las ${nAnt} subvariables que el PDF ya no nombra. `) +
  (SHOW_DIAG ? "" : `Sin las core measures de solo diagnóstico. `) +
  `Cada banda es una subvariable; si pertenece a varios dominios, recibe una banda de cada uno, y si varias ciudades estudian un dominio, se reparte entre ellas. ` +
  `${noSrc} no tienen fuente de datos definida.`
);
const cols = ["Dominio", "Core measure", "Subvariable", "Versión", "Fuente de datos", "Clase", "Calculado por", "Reto de limpieza para escalabilidad"];
const table = d3.select("#table");
table.append("thead").append("tr").selectAll("th").data(cols).join("th").text(d => d);

  .selectAll("td").data(r => [r.domains.join("; "), r.core, r.sub, r.version, r.sourceRaw || NO_SOURCE, r.cls, r.by, r.cleaning])

// --- Vista de dona ----------------------------------------------------------
// Anillos concéntricos: dominios (centro), core measures, subvariables
// (afuera). Como en el sankey, una subvariable de varios dominios aparece
// una vez en cada dominio (y su core measure también).
const donutTree = {
  children: DOMAINS.map(d => ({
    name: d, kind: "domain", domain: d,
    children: coreOrder.filter(c => ROWS.some(r => r.core === c && r.domains.includes(d))).map(c => ({
      name: c, kind: "core", domain: d,
      children: subOrder.filter(ri => ROWS[ri].core === c && ROWS[ri].domains.includes(d))
        .map(ri => ({ name: ROWS[ri].sub, kind: "sub", domain: d, row: ROWS[ri], value: 1 })),
    })),
  })),
};
// [radio interior, radio exterior] de cada anillo, en px
const RINGS = { 1: [76, 220], 2: [224, 392], 3: [396, 428] };
const LABEL_OUT = 300; // espacio para los nombres de las subvariables, afuera
const DSIZE = 2 * (RINGS[3][1] + LABEL_OUT);
const dsvg = d3.select("#donut").attr("width", DSIZE).attr("height", DSIZE).attr("viewBox", [-DSIZE / 2, -DSIZE / 2, DSIZE, DSIZE]);
const droot = d3.partition().size([2 * Math.PI, 1])(d3.hierarchy(donutTree).sum(d => d.value || 0));
const dnodes = droot.descendants().filter(n => n.depth > 0);
const darc = d3.arc()
  .startAngle(n => n.x0).endAngle(n => n.x1)
  .padAngle(n => n.depth === 3 ? 0.003 : 0.006).padRadius(300)
  .innerRadius(n => RINGS[n.depth][0]).outerRadius(n => RINGS[n.depth][1]);
const ringOpacity = n => n.depth === 1 ? 1 : n.depth === 2 ? 0.72 : n.data.row.anterior ? 0.18 : 0.45;
const arcSel = dsvg.append("g").selectAll("path").data(dnodes).join("path")
  .attr("class", "arc").attr("d", darc)
  .attr("fill", n => domainVar.get(n.data.domain)).attr("fill-opacity", ringOpacity);

// Nombres radiales (del centro hacia afuera; volteados en la mitad izquierda
// para que nunca queden de cabeza). Solo si el segmento es lo bastante alto.
const midDeg = n => (n.x0 + n.x1) / 2 * 180 / Math.PI;
const fits = (n, r) => (n.x1 - n.x0) * r >= 11;
function radial(n, r) {
  const a = midDeg(n);
  return `rotate(${a - 90}) translate(${r},0)` + (a > 180 ? " rotate(180)" : "");
}
const LABEL = {
  1: { r: RINGS[1][0] + 6, chars: 22 },
  2: { r: RINGS[2][0] + 16, chars: 30 },
  3: { r: RINGS[3][1] + 6, chars: 50 },
};
const dlabelSel = dsvg.append("g").selectAll("text")
  .data(dnodes.filter(n => fits(n, (RINGS[n.depth][0] + RINGS[n.depth][1]) / 2))).join("text")
  .attr("class", n => `dlabel ${n.data.kind}` + (n.depth === 3 && n.data.row.anterior ? " anterior" : ""))
  .attr("transform", n => radial(n, LABEL[n.depth].r))
  .attr("dy", "0.35em")
  .attr("text-anchor", n => midDeg(n) > 180 ? "end" : "start")
  .text(n => truncate(n.data.name, LABEL[n.depth].chars) + (n.depth === 3 && n.data.row.anterior ? " (anterior)" : ""));
// Core measures: círculo lleno = se recalcula; vacío = solo diagnóstico
const dmarkSel = dsvg.append("g").selectAll("circle").data(dnodes.filter(n => n.depth === 2)).join("circle")
  .attr("class", n => "cls-mark " + (coreCls.get(n.data.name) === "Recálculo" ? "recalc" : "diag"))
  .attr("r", 3.5)
  .attr("transform", n => `rotate(${midDeg(n) - 90}) translate(${RINGS[2][0] + 8},0)`);

const center = dsvg.append("text").attr("class", "donut-center");
function setCenter(big, small) {
  center.selectAll("tspan").remove();
  center.append("tspan").attr("class", "big").attr("x", 0).attr("dy", "-0.1em").text(big);
  center.append("tspan").attr("class", "small").attr("x", 0).attr("dy", "1.7em").text(small);
}
const uniqueSubs = n => new Set(n.leaves().map(l => l.data.row)).size;
setCenter(ROWS.length, "subvariables");

// Hover: resalta el segmento, lo que tiene adentro y afuera, y sus copias en
// otros dominios (misma subvariable o misma core measure).
function donutFocus(n) {
  const same = dnodes.filter(m => m.depth === n.depth &&
    (n.depth === 3 ? m.data.row === n.data.row : m.data.name === n.data.name));
  const on = new Set();
  same.forEach(m => { m.ancestors().forEach(a => on.add(a)); m.descendants().forEach(x => on.add(x)); });
  dsvg.classed("focus", true);
  arcSel.classed("on", m => on.has(m));
  dlabelSel.classed("on", m => on.has(m));
  dmarkSel.classed("on", m => on.has(m));
  return same.length;
}
function donutTip(n, copies) {
  if (n.depth === 3) {
    return nodeTip({ kind: "sub", row: n.data.row }) +
      (copies > 1 ? `<div style="margin-top:6px;color:var(--text-muted)">Aparece en ${copies} dominios</div>` : "");
  }
  const doms = n.depth === 2 ? [...new Set(ROWS.filter(r => r.core === n.data.name).flatMap(r => r.domains))] : [];
  const coreRow = n.depth === 2 ? ROWS.find(r => r.core === n.data.name) : null;
  const total = n.depth === 2 ? ROWS.filter(r => r.core === n.data.name).length : uniqueSubs(n);
  return `<strong>${n.data.name}</strong>${total} subvariables` +
    (coreRow ? `<br>${coreRow.cls === "Recálculo" ? "Se recalcula con las acciones de ReImagina" : "Solo diagnóstico"}` +
      (coreRow.coreOld ? `<br><span style="color:var(--text-muted)">Antes: ${coreRow.coreOld}</span>` : "") +
      (doms.length > 1 ? `<dl><dt>Dominios</dt><dd>${swatches(doms)}</dd></dl>` : "") : "");
}
arcSel
  .on("mouseenter", (e, n) => {
    const copies = donutFocus(n);
    setCenter(n.depth === 3 ? 1 : n.depth === 2 ? ROWS.filter(r => r.core === n.data.name).length : uniqueSubs(n),
      n.depth === 3 ? "subvariable" : "subvariables");
    tip.html(donutTip(n, copies)).style("opacity", 1); moveTip(e);
  })
  .on("mousemove", moveTip)
  .on("mouseleave", () => {
    dsvg.classed("focus", false); arcSel.classed("on", false); dlabelSel.classed("on", false); dmarkSel.classed("on", false);
    setCenter(ROWS.length, "subvariables"); tip.style("opacity", 0);
  });

// --- Sankey simple: solo dominio -> core measure -> subvariable -------------
// Sin ciudad de estudio, fuente de datos, escalabilidad ni reto de limpieza.
const simpleSvg = d3.select("#chart3");
const nodes3 = [], id3 = new Map();

DOMAINS.forEach(d => add3("d:" + d, 0, d, { kind: "domain", domain: d }));
coreOrder.forEach(c => add3("c:" + c, 1, c, { kind: "core" }));
subOrder.forEach(ri => add3("s:" + ri, 2, ROWS[ri].sub, { kind: "sub", row: ROWS[ri] }));
const flows3 = [];
ROWS.forEach((r, ri) => r.domains.forEach(d => flows3.push({ ri, d, anterior: r.anterior })));
const linkMap3 = new Map();
function addLink3(a, b, d, fi) {
  const k = `${a}|${b}|${d}`;
  if (!linkMap3.has(k)) linkMap3.set(k, { source: id3.get(a), target: id3.get(b), value: 0, domain: d, flows: new Set() });

flows3.forEach((f, fi) => {

const links3 = [...linkMap3.values()];

simpleSvg.attr("width", W3).attr("height", H3).attr("viewBox", [0, 0, W3, H3]);

["Dominio", "Core measure", "Subvariable"].forEach((t, c) => {
  simpleSvg.append("text").attr("class", "col-title").attr("x", graph3.nodes.find(n => n.col === c).x0).attr("y", 20).text(t);

node3Sel.append("rect")

  .attr("fill", d => d.kind === "domain" ? domainVar.get(d.domain) : "var(--node)");
node3Sel.filter(d => d.kind === "core").append("circle")
  .attr("class", d => "cls-mark " + (coreCls.get(d.name) === "Recálculo" ? "recalc" : "diag"))
  .attr("cx", d => d.x1 + 11).attr("cy", d => (d.y0 + d.y1) / 2).attr("r", 4);
const subCount3 = n => new Set([...n.flows].map(fi => flows3[fi].ri)).size;
const label3 = node3Sel.append("text")

label3.append("tspan").text(d => d.kind === "sub" ? truncate(d.name, 56) + (d.row.anterior ? " (anterior)" : "") : d.kind === "core" ? truncate(d.name, 60) : d.name);
label3.filter(d => d.kind !== "sub").append("tspan").attr("class", "count").text(d => `  ${subCount3(d)}`);

  return `<strong>${n.name}</strong>${subCount3(n)} subvariables` +

function focus3(flowSet) {
  simpleSvg.classed("focus", true);
  link3Sel.classed("on", l => [...l.flows].some(fi => flowSet.has(fi)));
  node3Sel.classed("on", n => [...n.flows].some(fi => flowSet.has(fi)));
}
function unfocus3() { simpleSvg.classed("focus", false); link3Sel.classed("on", false); node3Sel.classed("on", false); tip.style("opacity", 0); }
node3Sel
  .on("mouseenter", (e, n) => { focus3(n.flows); tip.html(simpleTip(n)).style("opacity", 1); moveTip(e); })
  .on("mousemove", moveTip).on("mouseleave", unfocus3);
link3Sel
  .on("mouseenter", (e, l) => {
    focus3(l.flows);
    tip.html(`<strong>${l.source.name} → ${l.target.name}</strong><span class="sw" style="background:${domainVar.get(l.domain)}"></span>${l.domain} · ${new Set([...l.flows].map(fi => flows3[fi].ri)).size} subvariables`).style("opacity", 1);
    moveTip(e);
  })
  .on("mousemove", moveTip).on("mouseleave", unfocus3);

// --- Selector de vista (se recuerda en este navegador) ---------------------
const VIEWS = { sankey: "sankey-wrap", dona: "donut-wrap", simple: "simple-wrap" };
function showView(v) {
  Object.entries(VIEWS).forEach(([k, id]) => { document.getElementById(id).hidden = k !== v; });
  document.querySelectorAll(".views button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  try { localStorage.setItem("reimagina-vista", v); } catch (e) {}
}
document.querySelectorAll(".views button").forEach(b => b.addEventListener("click", () => showView(b.dataset.view)));
let savedView = "sankey";
try { const stored = localStorage.getItem("reimagina-vista"); if (VIEWS[stored]) savedView = stored; } catch (e) {}
showView(savedView);
</script>
